# GitHub Pages への自動デプロイ
# main ブランチに push すると、サイトをビルドして公開します。
# 事前設定: リポジトリの Settings → Pages → Source を「GitHub Actions」にする
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build site
        run: |
          REPO="${{ github.event.repository.name }}"
          case "$REPO" in
            *.github.io) BASE="" ;;
            *)           BASE="/$REPO" ;;
          esac
          echo "BASE_URL=$BASE"
          BASE_URL="$BASE" node site/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
